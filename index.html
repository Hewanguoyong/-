<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神籬之庭｜本丸缘起 · 审神者测试</title>
<style>
:root {
  --ink:#263a4a; --deep:#183246; --rose:#c9959b; --rose2:#e6c3c3;
  --paper:#f8f2ed; --mist:#e9e1dd; --gold:#b59a69; --line:rgba(38,58,74,.18);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif;line-height:1.8}
button,input{font:inherit}

/* ===== 装饰 ===== */
.hero{min-height:760px;position:relative;overflow:hidden;background:
 radial-gradient(circle at 12% 13%,rgba(255,255,255,.8),transparent 18%),
 linear-gradient(180deg,#f3d8d6 0%,#e9c2c2 34%,#d8b1b6 55%,#91a6b6 56%,#526e83 74%,#203c51 100%)}
.mountain{position:absolute;left:-7%;bottom:23%;width:72%;height:42%;background:linear-gradient(160deg,transparent 24%,#dce2e2 25%,#a9bcc7 39%,#58788d 40%,#456479 100%);clip-path:polygon(0 78%,18% 52%,35% 42%,48% 0,58% 33%,71% 57%,100% 79%,100% 100%,0 100%);opacity:.9}
.mountain:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 47%,rgba(255,255,255,.5) 48% 52%,transparent 53%);opacity:.7}
.water{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,rgba(221,202,204,.15),rgba(26,52,68,.62));}
.pagoda{position:absolute;right:21%;bottom:22%;width:105px;height:205px;filter:drop-shadow(0 14px 10px rgba(20,39,51,.3))}
.pagoda .stem{position:absolute;left:49px;top:0;width:7px;height:205px;background:#263f4d}
.pagoda .roof{position:absolute;left:0;width:105px;height:28px;background:#223f4d;clip-path:polygon(50% 0,100% 72%,78% 72%,72% 100%,28% 100%,22% 72%,0 72%)}
.pagoda .r1{top:25px}.pagoda .r2{top:68px;transform:scale(.82);left:9%}.pagoda .r3{top:108px;transform:scale(.66);left:17%}.pagoda .r4{top:143px;transform:scale(.51);left:24%}
.pagoda .glow{position:absolute;left:37px;top:31px;width:31px;height:125px;background:linear-gradient(#d16e68,#e9a09a,#c56b64);opacity:.55;filter:blur(5px)}
.sakura{position:absolute;right:-8%;top:22%;width:38%;height:55%;opacity:.7}
.sakura i,.sakura b{position:absolute;display:block;width:12px;height:20px;border-radius:70% 10% 70% 10%;background:#d98e93;transform:rotate(35deg);box-shadow:20px 14px #e0a2a2,45px -8px #cf858c,70px 21px #e5b1b0}
.sakura i:nth-child(1){right:5%;top:18%;transform:rotate(22deg) scale(1.5)}.sakura i:nth-child(2){right:25%;top:42%;transform:rotate(-20deg) scale(.8)}.sakura i:nth-child(3){right:48%;top:62%;transform:rotate(70deg) scale(1.2)}.sakura b{right:12%;top:72%;transform:rotate(8deg) scale(.7)}
.hero-inner{position:relative;z-index:4;max-width:1120px;margin:auto;padding:92px 28px 0;text-align:center}
.eyebrow{letter-spacing:.38em;font-size:12px;color:#fff;text-transform:uppercase;text-shadow:0 1px 5px #546775}
h1{margin:15px 0 8px;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:clamp(55px,10vw,112px);letter-spacing:.08em;font-weight:500;text-shadow:0 2px 18px rgba(255,255,255,.55)}
.subtitle{color:#fff;font-size:14px;letter-spacing:.35em}
.hero-copy{max-width:700px;margin:50px auto 0;color:#f9f6f4;font-size:16px;text-shadow:0 1px 7px rgba(21,40,52,.7)}
.hero-actions{margin-top:35px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.13);color:white;padding:11px 28px;cursor:pointer;letter-spacing:.18em;backdrop-filter:blur(5px);transition:.25s;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}

/* ===== 测试容器 ===== */
.test-shell{background:linear-gradient(135deg,#f1e5e2,#f8f4f0);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:50px 0}
.section{max-width:820px;margin:0 auto;padding:0 26px}
.panel{background:rgba(255,255,255,.65);border:1px solid rgba(181,154,105,.3);padding:32px 30px;box-shadow:0 10px 30px rgba(49,61,68,.05)}
.progress{height:3px;background:#ddd1ce;margin:0 0 35px}
.progress .bar{display:block;height:100%;background:#b9868d;width:0;transition:.3s}
.qno{font-size:12px;letter-spacing:.25em;color:#9b7479;margin-bottom:10px}
.question{font-size:27px;line-height:1.55;margin:12px 0 30px;color:var(--deep)}
.options{display:grid;grid-template-columns:1fr;gap:13px}
.option{text-align:left;border:1px solid rgba(38,58,74,.18);background:rgba(255,255,255,.68);padding:18px 20px;cursor:pointer;color:#40545f;transition:.22s;font-family:inherit;font-size:inherit;width:100%}
.option:hover{border-color:#b78b91;transform:translateY(-2px);box-shadow:0 8px 20px rgba(80,62,67,.08)}
.option.selected{border-color:#b78b91;background:#fff5f0}
.option input{display:none}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.actions button{background:var(--rose);color:white;border:0;padding:12px 22px;cursor:pointer;font-family:inherit;transition:.2s;border-radius:0}
.actions button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.actions button:hover{opacity:.8}

/* ===== 基础五术分配 ===== */
.allocation{display:grid;gap:18px;margin-top:10px}
.allocrow{display:grid;grid-template-columns:110px 1fr 50px;gap:12px;align-items:center}
.allocrow input[type=number]{width:76px;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:8px;font-family:inherit;text-align:center}
.allocrow input[type=number]:focus{outline:1px solid var(--gold)}
.allocrow span{color:var(--deep);font-weight:500}
.ability-help{display:grid;gap:8px;margin:14px 0}
.ability-help div{border-left:2px solid var(--gold);padding:7px 14px;color:#66737b;line-height:1.65}
.ability-help strong{color:var(--deep)}
.remain-badge{display:inline-block;padding:4px 14px;font-size:14px;letter-spacing:.1em;background:#f0eae6;border:1px solid var(--line)}
.remain-badge.warning{background:#f7e0d6;border-color:#c9959b}

/* ===== 结果页 ===== */
.result h2{font-size:32px;font-weight:400;color:var(--deep);margin-bottom:10px}
.result .big{font-size:25px;color:var(--ink);font-weight:500}
.result .note{color:#66737b;font-size:14px;line-height:1.8}
.result .eyebrow{color:var(--rose);letter-spacing:.22em;font-size:12px;text-shadow:none}
.result hr{margin:30px 0;border:0;border-top:1px solid var(--line)}
.result .tag{display:inline-block;border:1px solid var(--line);color:#6a7a82;padding:5px 9px;margin:4px;font-size:12px}
.result .restart-btn{background:transparent;border:1px solid var(--line);color:var(--ink);padding:10px 24px;cursor:pointer;font-family:inherit;margin-top:20px;transition:.2s}
.result .restart-btn:hover{background:var(--paper)}

@media(max-width:800px){.hero{min-height:680px}.pagoda{right:6%;transform:scale(.8);transform-origin:bottom right}}
@media(max-width:520px){.section{padding:0 14px}.panel{padding:20px 16px}.question{font-size:22px}.allocrow{grid-template-columns:82px 1fr 42px}}
</style>
</head>

        body:`${voice}${opener}你的结果突出${sub}与${role}的方向，因此你们容易在${traits}相关的事务上互相理解。你可能负责确定愿望、承担选择或提供灵力，而${name}更可能以他自己的经验和行动方式，把这些选择变成可以落实的本丸生活。`,
        relation:`你们可能形成一种有明确分工、又保留彼此判断的关系。你不必把他简化为执行者；他也不只是回应命令的人。更自然的相处方式，是你们在关键节点互相确认，让他的个性、经历与判断真正参与本丸的决定。`
      };
      return {
        title:'为什么他能与你互补',
        body:`${voice}${name}较突出的方向是${traits}。这不是说你缺少这些能力，而是说当你习惯以${sub}的方式处理问题时，他可能带来另一种节奏：有时更直接，有时更谨慎，有时更重视经验本身。这样的差异能够让你的本丸避免只沿着单一思路运转。`,
        relation:`你们可能形成一种彼此校正的关系。你保留审神者的决定权，同时允许${name}用他独有的立场提出提醒、承担另一部分责任，或让你看见原本容易忽略的细节。`
      };
    };
    const bestText=charText(best,'best'), compText=charText(comp,'comp');
    app.innerHTML=`<div class="result" style="display:block;text-align:center;padding:15px 0 20px">
        <div class="result-seal" style="width:82px;height:82px;border:1px solid #b99673;border-radius:50%;display:grid;place-items:center;margin:0 auto 25px;color:#a77e54;font-size:12px;letter-spacing:.15em">御神籬</div>
        <div class="eyebrow" style="color:var(--rose);letter-spacing:.22em;font-size:12px">YOUR HONMARU RESPONDS</div>
        <h3 style="font-size:44px;font-weight:500;margin:10px 0;color:#243e4f">审神者职能 · ${role}</h3><div class="big">专精倾向：${sub}</div>
        <div class="name-jp" style="font-family:Georgia,serif;font-size:14px;letter-spacing:.25em;color:#9b7479">本丸身份：${identity}</div>
        <div class="result-box" style="max-width:760px;margin:24px auto 0;padding:24px;text-align:left;background:rgba(255,255,255,.45);border:1px solid rgba(181,154,105,.25)">
            <p style="margin:0 0 14px;color:#59676e;line-height:1.9"><strong>这个职能意味着什么：</strong>${descriptions.role[role]}</p>
            <p style="margin:0 0 14px;color:#59676e;line-height:1.9"><strong>你的专精倾向：</strong>${descriptions.sub[sub]}</p>
            <p style="margin:0;color:#59676e;line-height:1.9"><strong>本丸身份的含义：</strong>${descriptions.identity[identity]}</p>
        </div>
        <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:24px 0">
            ${Object.keys(s).filter(k=>s[k]>0).sort((a,b)=>s[b]-s[a]).slice(0,5).map(k=>`<span class="tag" style="display:inline-block;border:1px solid var(--line);color:#6a7a82;padding:5px 9px;margin:4px;font-size:12px">${k}</span>`).join('')}
        </div>
        <div class="result-box" style="max-width:760px;margin:35px auto 0;padding:30px;text-align:left;background:rgba(255,255,255,.65);border:1px solid rgba(181,154,105,.3)">
            <p style="margin:7px 0;color:#59676e"><strong>基础五术：</strong>感知 ${alloc.感知}／励起 ${alloc.励起}／顕現 ${alloc.顕現}／契约 ${alloc.契约}／维持 ${alloc.维持}</p>
            <div style="margin:18px 0 24px;padding-bottom:20px;border-bottom:1px solid rgba(181,154,105,.22)">
              <p style="margin:7px 0;color:#59676e"><strong>最适配的刀剑男士：</strong>${best.c.刀剣男士}</p>
              <p style="margin:7px 0;color:#59676e;line-height:1.9"><strong>${bestText.title}：</strong>${bestText.body}</p>
              <p style="margin:7px 0;color:#59676e;line-height:1.9"><strong>你们可能形成的关系：</strong>${bestText.relation}</p>
            </div>
            <div style="margin:18px 0">
              <p style="margin:7px 0;color:#59676e"><strong>互补的刀剑男士：</strong>${comp.c.刀剣男士}</p>
              <p style="margin:7px 0;color:#59676e;line-height:1.9"><strong>${compText.title}：</strong>${compText.body}</p>
              <p style="margin:7px 0;color:#59676e;line-height:1.9"><strong>你们可能形成的关系：</strong>${compText.relation}</p>
            </div><p class="note">本结果不是能力等级评判。六大职能与五术人人皆有，差异来自本次分配与答题所形成的专精方向。</p>
            <p style="margin-top:18px;color:#8d6b70">“本丸没有替你决定答案。它只是把你已经做出的选择，交还给你。”</p>
        </div>
        <button class="restart-btn" onclick="location.reload()" style="background:transparent;border:1px solid var(--line);color:var(--ink);padding:10px 24px;cursor:pointer;font-family:inherit;margin-top:20px;transition:.2s">重新举行一次禊</button>
    </div>`;
}
render();
</script>
</body>
</html>
