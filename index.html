<style>

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif;line-height:1.8}
button,input{font:inherit}
.hero{min-height:760px;position:relative;overflow:hidden;background:
 radial-gradient(circle at 12% 13%,rgba(255,255,255,.8),transparent 18%),
 linear-gradient(180deg,#f3d8d6 0%,#e9c2c2 34%,#d8b1b6 55%,#91a6b6 56%,#526e83 74%,#203c51 100%)}
.mountain{position:absolute;left:-7%;bottom:23%;width:72%;height:42%;background:linear-gradient(160deg,transparent 24%,#dce2e2 25%,#a9bcc7 39%,#58788d 40%,#456479 100%);clip-path:polygon(0 78%,18% 52%,35% 42%,48% 0,58% 33%,71% 57%,100% 79%,100% 100%,0 100%);opacity:.9}
.mountain:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 47%,rgba(255,255,255,.5) 48% 52%,transparent 53%);opacity:.7}
.water{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,rgba(221,202,204,.15),rgba(26,52,68,.62));}
.pagoda{position:absolute;right:21%;bottom:22%;width:105px;height:205px;filter:drop-shadow(0 14px 10px rgba(20,39,51,.3))}
.pagoda .stem{position:absolute;left:49px;top:0;width:7px;height:205px;background:#263f4d}
.pagoda .roof{position:absolute;left:0;width:105px;height:28px;background:#223f4d;clip-path:polygon(50% 0,100% 72%,78% 72%,72% 100%,28% 100%,22% 72%,0 72%)}
.pagoda .r1{top:25px}.pagoda .r2{top:68px;transform:scale(.82);left:9%}.pagoda .r3{top:108px;transform:scale(.66);left:17%}.pagoda .r4{top:143px;transform:scale(.51);left:24%}
.pagoda .glow{position:absolute;left:37px;top:31px;width:31px;height:125px;background:linear-gradient(#d16e68,#e9a09a,#c56b64);opacity:.55;filter:blur(5px)}
.sakura{position:absolute;right:-8%;top:22%;width:38%;height:55%;opacity:.7}
.sakura i,.sakura b{position:absolute;display:block;width:12px;height:20px;border-radius:70% 10% 70% 10%;background:#d98e93;transform:rotate(35deg);box-shadow:20px 14px #e0a2a2,45px -8px #cf858c,70px 21px #e5b1b0}
.sakura i:nth-child(1){right:5%;top:18%;transform:rotate(22deg) scale(1.5)}.sakura i:nth-child(2){right:25%;top:42%;transform:rotate(-20deg) scale(.8)}.sakura i:nth-child(3){right:48%;top:62%;transform:rotate(70deg) scale(1.2)}.sakura b{right:12%;top:72%;transform:rotate(8deg) scale(.7)}
.hero-inner{position:relative;z-index:4;max-width:1120px;margin:auto;padding:92px 28px 0;text-align:center}
.eyebrow{letter-spacing:.38em;font-size:12px;color:#fff;text-transform:uppercase;text-shadow:0 1px 5px #546775}
h1{margin:15px 0 8px;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:clamp(55px,10vw,112px);letter-spacing:.08em;font-weight:500;text-shadow:0 2px 18px rgba(255,255,255,.55)}
.subtitle{color:#fff;font-size:14px;letter-spacing:.35em}
.hero-copy{max-width:700px;margin:50px auto 0;color:#f9f6f4;font-size:16px;text-shadow:0 1px 7px rgba(21,40,52,.7)}
.hero-actions{margin-top:35px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.13);color:white;padding:11px 28px;cursor:pointer;letter-spacing:.18em;backdrop-filter:blur(5px);transition:.25s}
.btn:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
.section{max-width:1100px;margin:0 auto;padding:86px 26px}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:38px}
.kicker{font-size:11px;letter-spacing:.3em;color:#a0767c;text-transform:uppercase}
h2{font-size:34px;font-weight:500;letter-spacing:.08em;margin:7px 0;color:var(--deep)}
.lead{max-width:630px;color:#66737b;font-size:14px}
.notice{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:24px 0;color:#5c6870}
.notice strong{color:#8d6066}
.lore-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:rgba(255,255,255,.58);border:1px solid rgba(181,154,105,.25);padding:25px;min-height:165px;box-shadow:0 10px 30px rgba(49,61,68,.05)}
.card .jp{font-size:22px;color:var(--deep)} .card p{font-size:13px;color:#65727a;margin-bottom:0}
.test-shell{background:linear-gradient(135deg,#f1e5e2,#f8f4f0);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.progress{height:3px;background:#ddd1ce;margin:0 0 35px} .progress span{display:block;height:100%;background:#b9868d;width:0;transition:.3s}
.qno{font-size:12px;letter-spacing:.25em;color:#9b7479}
.question{font-size:27px;line-height:1.55;margin:12px 0 30px;max-width:800px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.option{text-align:left;border:1px solid rgba(38,58,74,.18);background:rgba(255,255,255,.68);padding:18px 20px;cursor:pointer;color:#40545f;transition:.22s}
.option:hover{border-color:#b78b91;transform:translateY(-2px);box-shadow:0 8px 20px rgba(80,62,67,.08)}
.option small{display:block;color:#a18a8d;margin-bottom:5px;letter-spacing:.1em}
.result{display:none;text-align:center;padding:15px 0 50px}
.result.show{display:block}
.result-seal{width:82px;height:82px;border:1px solid #b99673;border-radius:50%;display:grid;place-items:center;margin:0 auto 25px;color:#a77e54;font-size:12px;letter-spacing:.15em}
.result h3{font-size:44px;font-weight:500;margin:10px 0;color:#243e4f}
.result .name-jp{font-family:Georgia,serif;font-size:14px;letter-spacing:.25em;color:#9b7479}
.tags{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:24px 0}
.tag{padding:5px 12px;border:1px solid #cbb5ad;background:#fff8f4;color:#80686a;font-size:12px}
.result-box{max-width:760px;margin:35px auto 0;padding:30px;text-align:left;background:rgba(255,255,255,.65);border:1px solid rgba(181,154,105,.3)}
.result-box p{margin:7px 0;color:#59676e}
.restart{margin-top:25px;color:#8a6469;border:0;background:transparent;cursor:pointer;text-decoration:underline}
.directory{background:#f0e7e4}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:25px}
.filter{border:1px solid #cdbcb8;background:transparent;padding:7px 12px;color:#637078;cursor:pointer;font-size:12px}
.filter.active,.filter:hover{background:#fff;color:#8c656a;border-color:#b99196}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.char{background:rgba(255,255,255,.62);padding:13px 15px;border:1px solid rgba(38,58,74,.09);font-size:14px;display:flex;justify-content:space-between;gap:10px}
.char span{font-size:10px;color:#9b8083;white-space:nowrap}
.mechanics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
footer{padding:50px 26px 70px;text-align:center;background:#213e51;color:#dce2e3;font-size:12px}
footer a{color:#e8c7c6}
@media(max-width:800px){.hero{min-height:680px}.lore-grid,.mechanics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.pagoda{right:6%;transform:scale(.8);transform-origin:bottom right}}

</style>
</head>

"choices":[{"text":"先确认改变会影响哪条因果链。","key":"observe"},{"text":"立即切断最危险的节点。","key":"attack"},{"text":"保护仍然没有被波及的人。","key":"protect"},{"text":"让队伍分成两路，一边追踪，一边控制局面。","key":"command"}]},{"title":"战場 — 你更相信哪一种战斗？","choices":[{"text":"近身，快、准、干净。","key":"speed"},{"text":"保持距离，用节奏消耗对方。","key":"range"},{"text":"正面承受压力，再一口气反击。","key":"power"},{"text":"让全队形成一个整体，压住战场。","key":"command"}]},{"title":"刀種 — 如果你的战斗方式必须舍弃一种优势，你舍得舍弃？","choices":[{"text":"体格与重量，换取灵活。","key":"speed"},{"text":"速度，换取一击的重量。","key":"power"},{"text":"单点爆发，换取更大的控制范围。","key":"range"},{"text":"个人锋芒，换取团队稳定。","key":"protect"}]},{"title":"鎮め — 同伴情绪失控，你会？","choices":[{"text":"陪他坐着，不急着说话。","key":"empathy"},{"text":"给他明确的下一步行动。","key":"order"},{"text":"把人带离现场，先恢复平静。","key":"protect"},{"text":"直接指出他正在忽略的事实。","key":"observe"}]},{"title":"産霊 — 你认为“新的东西”最容易从哪里诞生？","choices":[{"text":"传统被重新理解的时候。","key":"tradition"},{"text":"人与人产生连接的时候。","key":"empathy"},{"text":"混乱被重新组织的时候。","key":"order"},{"text":"旧规则被打破的时候。","key":"change"}]},{"title":"御神体 — 若本丸有一件真正重要的宝物，你会怎么保管？","choices":[{"text":"藏在最深处，只有必要时才取出。","key":"protect"},{"text":"让它成为所有人都能看见的中心。","key":"order"},{"text":"设置多重机关与诱导路线。","key":"observe"},{"text":"交给最信任的人随身携带。","key":"empathy"}]},{"title":"遠征 — 一次长期远征，你最在意什么？","choices":[{"text":"物资与路线。","key":"order"},{"text":"队员之间的关系。","key":"empathy"},{"text":"未知情报。","key":"observe"},{"text":"回来的时间与效率。","key":"speed"}]},{"title":"鍛刀 — 新刀显现的瞬间，你会？","choices":[{"text":"先向它行礼，再听它自我介绍。","key":"purify"},{"text":"立刻观察它的刀装与状态。","key":"observe"},{"text":"询问它愿意承担怎样的位置。","key":"empathy"},{"text":"直接带它去试刀。","key":"action"}]},{"title":"手入 — 受伤的刀剑男士拒绝休息，你会？","choices":[{"text":"坚持让他留下，这是命令。","key":"order"},{"text":"陪他聊天，等他自己放下戒备。","key":"empathy"},{"text":"告诉他继续战斗会损失什么。","key":"observe"},{"text":"给他一个明确的休整期限。","key":"protect"}]},{"title":"演練 — 面对陌生的强敌，你第一反应？","choices":[{"text":"观察对方的习惯。","key":"observe"},{"text":"用速度抢先手。","key":"speed"},{"text":"逼迫对方进入你的节奏。","key":"command"},{"text":"正面测试力量。","key":"power"}]},{"title":"本丸 — 如果本丸只能保留一种氛围？ const D = window.TOUKEN_TEST_DATA;
let current=0, answers=[], scores={};
const labels={observe:"观",purify:"祓",order:"律",command:"御",empathy:"结",action:"动",attack:"攻",protect:"守",nature:"自然",speed:"迅",range:"域",power:"力",tradition:"古",change:"变"};

function renderQuestion(){
  const q=D.questions[current];
  document.getElementById("qno").textContent=`QUESTION ${String(current+1).padStart(2,"0")} / ${D.questions.length}`;
  document.getElementById("question").textContent=q.title;
  document.getElementById("bar").style.width=((current)/D.questions.length*100)+"%";
  const box=document.getElementById("options"); box.innerHTML="";
  q.choices.forEach((c,i)=>{
    const b=document.createElement("button"); b.className="option";
    b.innerHTML=`<small>${String.fromCharCode(65+i)} · 选项</small>${c.text}`;
    b.onclick=()=>choose(c.key); box.appendChild(b);
  });
}
function choose(key){
  scores[key]=(scores[key]||0)+1;
  answers.push(key); current++;
  if(current<D.questions.length) renderQuestion(); else showResult();
}
function vectorScore(c){
  let s=0;
  Object.entries(scores).forEach(([k,v])=>s+=(c.bias[k]||0)*v);
  // 小幅稳定扰动，避免同刀种永远聚集在一个答案
  s += (stableHash(c.name)%17)/20;
  return s;
}
function stableHash(s){let h=2166136261; for(const ch of s){h^=ch.charCodeAt(0); h=Math.imul(h,16777619)} return h>>>0}

function showResult(){
  document.getElementById("quiz").style.display="none";
  document.getElementById("result").classList.add("show");
  document.getElementById("bar").style.width="100%";
  const ranked=[...D.characters].sort((a,b)=>vectorScore(b)-vectorScore(a));
  const c=ranked[0];
  const typePhrase={"短刀":"迅疾、贴近、以观察寻找缝隙","脇差":"灵活、折返、在变化中抓住机会","打刀":"均衡、应变、把局面拉回可控范围","太刀":"正面、从容、以稳定压住战场","大太刀":"广域、强力、承担沉重的一击","槍":"贯通、远近兼顾、直线突破","薙刀":"横扫、守势宽广、覆盖队伍","剣":"净化、守护、以特殊的秩序回应异常"}[c.type];
  document.getElementById("resultName").textContent=c.name;
  document.getElementById("resultSchool").textContent=`${c.school} · ${c.type}`;
  const topAxes=Object.entries(scores).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>`<span class="tag">${labels[x[0]]||x[0]}</span>`).join("");
  document.getElementById("resultTags").innerHTML=topAxes+`<span class="tag">${c.type}</span>`;
  document.getElementById("resultText").innerHTML=`
    <p><strong>你的神意路径：</strong>每次选择留下的轨迹。</p>
    <p><strong>刀种：</strong>${c.type} —— ${typePhrase}。</p>
    <p><strong>刀派：</strong>${c.school}。这只是一个小测试，或许祂很适合来帮你料理本丸呢！</p>
    <p><strong>战场倾向：</strong>${topAxes ? "你在测试中最常出现的倾向被记录为上方四枚印记。" : "你的回答尚未形成明显的偏向。"}</p>
    <p style="margin-top:18px;color:#8d6b70">“本丸没有替你决定答案。它只是把你已经做出的选择，交还给你。”</p>`;
}
function restart(){
  current=0; answers=[]; scores={};
  document.getElementById("result").classList.remove("show");
  document.getElementById("quiz").style.display="";
  renderQuestion();
  document.getElementById("test").scrollIntoView({behavior:"smooth"});
}

renderQuestion();
</script>
