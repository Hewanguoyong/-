<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>神籬之庭｜本丸缘起 · 审神者测试</title>
<style>
:root{--ink:#263a4a;--deep:#183246;--rose:#c9959b;--rose2:#e6c3c3;--paper:#f8f2ed;--mist:#e9e1dd;--gold:#b59a69;--line:rgba(38,58,74,.18)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);background:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif;line-height:1.8}
button,input{font:inherit}
.hero{min-height:760px;position:relative;overflow:hidden;background:radial-gradient(circle at 12% 13%,rgba(255,255,255,.8),transparent 18%),linear-gradient(180deg,#f3d8d6 0%,#e9c2c2 34%,#d8b1b6 55%,#91a6b6 56%,#526e83 74%,#203c51 100%)}
.mountain{position:absolute;left:-7%;bottom:23%;width:72%;height:42%;background:linear-gradient(160deg,transparent 24%,#dce2e2 25%,#a9bcc7 39%,#58788d 40%,#456479 100%);clip-path:polygon(0 78%,18% 52%,35% 42%,48% 0,58% 33%,71% 57%,100% 79%,100% 100%,0 100%);opacity:.9}
.mountain:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 0 47%,rgba(255,255,255,.5) 48% 52%,transparent 53%);opacity:.7}
.water{position:absolute;left:0;right:0;bottom:0;height:28%;background:linear-gradient(180deg,rgba(221,202,204,.15),rgba(26,52,68,.62))}
.pagoda{position:absolute;right:21%;bottom:22%;width:105px;height:205px;filter:drop-shadow(0 14px 10px rgba(20,39,51,.3))}
.pagoda .stem{position:absolute;left:49px;top:0;width:7px;height:205px;background:#263f4d}
.pagoda .roof{position:absolute;left:0;width:105px;height:28px;background:#223f4d;clip-path:polygon(50% 0,100% 72%,78% 72%,72% 100%,28% 100%,22% 72%,0 72%)}
.pagoda .r1{top:25px}.pagoda .r2{top:68px;transform:scale(.82);left:9%}.pagoda .r3{top:108px;transform:scale(.66);left:17%}.pagoda .r4{top:143px;transform:scale(.51);left:24%}
.pagoda .glow{position:absolute;left:37px;top:31px;width:31px;height:125px;background:linear-gradient(#d16e68,#e9a09a,#c56b64);opacity:.55;filter:blur(5px)}
.sakura{position:absolute;right:-8%;top:22%;width:38%;height:55%;opacity:.7}
.sakura i,.sakura b{position:absolute;display:block;width:12px;height:20px;border-radius:70% 10% 70% 10%;background:#d98e93;transform:rotate(35deg);box-shadow:20px 14px #e0a2a2,45px -8px #cf858c,70px 21px #e5b1b0}
.sakura i:nth-child(1){right:5%;top:18%;transform:rotate(22deg) scale(1.5)}.sakura i:nth-child(2){right:25%;top:42%;transform:rotate(-20deg) scale(.8)}.sakura i:nth-child(3){right:48%;top:62%;transform:rotate(70deg) scale(1.2)}.sakura b{right:12%;top:72%;transform:rotate(8deg) scale(.7)}
.hero-inner{position:relative;z-index:4;max-width:1120px;margin:auto;padding:92px 28px 0;text-align:center}
.eyebrow{letter-spacing:.38em;font-size:12px;color:#fff;text-transform:uppercase;text-shadow:0 1px 5px #546775}
h1{margin:15px 0 8px;color:#fff;font-family:Georgia,"Times New Roman",serif;font-size:clamp(55px,10vw,112px);letter-spacing:.08em;font-weight:500;text-shadow:0 2px 18px rgba(255,255,255,.55)}
.subtitle{color:#fff;font-size:14px;letter-spacing:.35em}
.hero-copy{max-width:700px;margin:50px auto 0;color:#f9f6f4;font-size:16px;text-shadow:0 1px 7px rgba(21,40,52,.7)}
.hero-actions{margin-top:35px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{border:1px solid rgba(255,255,255,.75);background:rgba(255,255,255,.13);color:white;padding:11px 28px;cursor:pointer;letter-spacing:.18em;backdrop-filter:blur(5px);transition:.25s;font-family:inherit}
.btn:hover{background:rgba(255,255,255,.28);transform:translateY(-2px)}
.test-shell{background:linear-gradient(135deg,#f1e5e2,#f8f4f0);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:50px 0}
.section{max-width:820px;margin:0 auto;padding:0 26px}
.panel{background:rgba(255,255,255,.65);border:1px solid rgba(181,154,105,.3);padding:32px 30px;box-shadow:0 10px 30px rgba(49,61,68,.05)}
.progress{height:3px;background:#ddd1ce;margin:0 0 35px}
.progress .bar{display:block;height:100%;background:#b9868d;width:0;transition:.3s}
.qno{font-size:12px;letter-spacing:.25em;color:#9b7479;margin-bottom:10px}
.question{font-size:27px;line-height:1.55;margin:12px 0 30px;color:var(--deep)}
.options{display:grid;grid-template-columns:1fr;gap:13px}
.option{text-align:left;border:1px solid rgba(38,58,74,.18);background:rgba(255,255,255,.68);padding:18px 20px;cursor:pointer;color:#40545f;transition:.22s;font-family:inherit;font-size:inherit;width:100%}
.option:hover{border-color:#b78b91;transform:translateY(-2px);box-shadow:0 8px 20px rgba(80,62,67,.08)}
.option.selected{border-color:#b78b91;background:#fff5f0}
.actions{display:flex;justify-content:space-between;gap:12px;margin-top:24px}
.actions button{background:var(--rose);color:white;border:0;padding:12px 22px;cursor:pointer;font-family:inherit;transition:.2s;border-radius:0}
.actions button.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
.actions button:hover{opacity:.8}
.allocation{display:grid;gap:18px;margin-top:10px}
.allocrow{display:grid;grid-template-columns:110px 1fr 50px;gap:12px;align-items:center}
.allocrow input[type=number]{width:76px;background:var(--paper);color:var(--ink);border:1px solid var(--line);padding:8px;font-family:inherit;text-align:center}
.allocrow span{color:var(--deep);font-weight:500}
.ability-help{display:grid;gap:8px;margin:14px 0}
.ability-help div{border-left:2px solid var(--gold);padding:7px 14px;color:#66737b;line-height:1.65}
.ability-help strong{color:var(--deep)}
.remain-badge{display:inline-block;padding:4px 14px;font-size:14px;letter-spacing:.1em;background:#f0eae6;border:1px solid var(--line)}
.remain-badge.warning{background:#f7e0d6;border-color:#c9959b}
.result .big{font-size:25px;color:var(--ink);font-weight:500}
.result .note{color:#66737b;font-size:14px;line-height:1.8}
.result .eyebrow{color:var(--rose);letter-spacing:.22em;font-size:12px;text-shadow:none}
.result .tag{display:inline-block;border:1px solid var(--line);color:#6a7a82;padding:5px 9px;margin:4px;font-size:12px}
.result .restart-btn{background:transparent;border:1px solid var(--line);color:var(--ink);padding:10px 24px;cursor:pointer;font-family:inherit;margin-top:20px;transition:.2s}
.result .restart-btn:hover{background:var(--paper)}
.second-intro-note{color:#66737b;font-size:14px;line-height:1.9;margin:0 0 24px}
.private-grid{display:grid;gap:18px;margin:22px 0}
.private-field{display:grid;gap:7px}
.private-field label{font-size:13px;color:#59676e;letter-spacing:.08em}
.private-field input[type=date],.private-field select{width:100%;padding:11px 12px;border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink);font-family:inherit}
.region-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.region-option{position:relative}
.region-option input{position:absolute;opacity:0;pointer-events:none}
.region-option label{display:block;padding:14px 16px;border:1px solid var(--line);background:rgba(255,255,255,.68);cursor:pointer;text-align:center;color:#40545f;transition:.2s}
.region-option input:checked+label{border-color:#b78b91;background:#fff5f0;color:var(--deep)}
.privacy-stage{position:relative}
/* ============================================================
   第二阶段 UI：整页深色和风 / 金红纹样
   只在 body.second-stage-active 时启用；第一阶段完全保留。
   ============================================================ */
body.second-stage-active{
  color:#e9e0d2;
  background:#0b0c0d;
  overflow-x:hidden;
}
body.second-stage-active .hero,
body.second-stage-active footer{display:none}
body.second-stage-active .test-shell{
  min-height:100vh;
  padding:0;
  border:0;
  background:
    radial-gradient(circle at 50% 15%,rgba(126,31,34,.12),transparent 28%),
    linear-gradient(180deg,#090a0b 0%,#101012 48%,#08090a 100%);
}
body.second-stage-active .section{
  max-width:none;
  width:100%;
  min-height:100vh;
  padding:0;
}
body.second-stage-active .panel{
  position:relative;
  min-height:100vh;
  padding:0;
  border:0;
  box-shadow:none;
  background:transparent;
  overflow:hidden;
}
body.second-stage-active .panel::before,
body.second-stage-active .panel::after{
  content:"";
  position:absolute;
  pointer-events:none;
  z-index:0;
}
body.second-stage-active .panel::before{
  inset:22px;
  border:1px solid rgba(184,151,96,.22);
}
body.second-stage-active .panel::after{
  inset:30px;
  border:1px solid rgba(184,151,96,.07);
}
.second-question-stage,
.second-result{
  position:relative;
  z-index:2;
  min-height:100vh;
  width:100%;
  margin:0;
  padding:72px clamp(28px,7vw,110px) 70px;
  background:
    radial-gradient(circle at 15% 18%,rgba(142,45,42,.12),transparent 23%),
    radial-gradient(circle at 84% 78%,rgba(190,150,74,.08),transparent 25%),
    linear-gradient(180deg,rgba(7,8,9,.98),rgba(18,17,19,.98) 55%,rgba(8,9,10,.99));
  color:#e7ded0;
  overflow:hidden;
}
.second-question-stage::before,
.second-result::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background:
    repeating-linear-gradient(90deg,transparent 0 79px,rgba(198,165,103,.025) 80px,transparent 81px),
    repeating-linear-gradient(0deg,transparent 0 79px,rgba(198,165,103,.018) 80px,transparent 81px);
}
.second-question-stage::after,
.second-result::after{
  content:"後続記録";
  position:absolute;
  right:clamp(34px,5vw,72px);
  top:50%;
  transform:translateY(-50%);
  writing-mode:vertical-rl;
  font-family:"Songti SC","SimSun",serif;
  font-size:11px;
  letter-spacing:.55em;
  color:rgba(201,168,113,.32);
  pointer-events:none;
}
.second-question-stage .second-stage-inner,
.second-result > *{position:relative;z-index:2}
.second-question-stage .second-stage-inner{max-width:920px;margin:0 auto}
.second-question-stage .qno{
  color:#b18e5d;
  letter-spacing:.3em;
  text-align:center;
  font-size:11px;
  margin-bottom:14px;
}
.second-question-stage .progress{background:rgba(235,220,194,.11);height:2px;margin:0 auto 32px;max-width:720px}
.second-question-stage .progress .bar{background:#ad8650}
.second-question-stage .second-stage-kicker{
  font-size:10px;
  letter-spacing:.42em;
  color:#9b805d;
  text-align:center;
  margin:0 0 20px;
}
.second-question-stage .question{
  font-family:"Songti SC","SimSun",serif;
  font-size:clamp(29px,4.5vw,48px);
  font-weight:400;
  letter-spacing:.16em;
  color:#f0e6d6;
  text-align:center;
  margin:0 auto 30px;
  text-shadow:0 2px 20px rgba(0,0,0,.65);
}
.second-question-stage .question-prompt{
  color:#cfc5b7!important;
  background:rgba(0,0,0,.22);
  border-left:1px solid rgba(173,137,86,.48);
  border-right:1px solid rgba(173,137,86,.10);
  padding:25px 30px!important;
  line-height:2!important;
  box-sizing:border-box;
  max-width:820px!important;
  margin:0 auto 30px!important;
  box-shadow:inset 0 0 35px rgba(0,0,0,.18);
}
.second-question-stage .options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  margin:30px auto 0;
  max-width:820px;
}
.second-question-stage .option{
  position:relative;
  text-align:left;
  min-height:68px;
  padding:16px 20px 16px 22px;
  border:1px solid rgba(198,173,135,.23);
  background:rgba(255,255,255,.025);
  color:#ded5c8;
  cursor:pointer;
  transition:.28s ease;
  font-family:inherit;
  line-height:1.75;
  overflow:hidden;
}
.second-question-stage .option::before{
  content:"";
  position:absolute;
  left:0;top:0;bottom:0;
  width:2px;
  background:transparent;
  transition:.25s ease;
}
.second-question-stage .option strong{
  color:#b99058;
  font-family:Georgia,serif;
  margin-right:8px;
  font-weight:500;
}
.second-question-stage .option:hover{
  border-color:rgba(197,156,92,.65);
  background:rgba(137,47,45,.11);
  transform:translateY(-1px);
}
.second-question-stage .option:hover::before,
.second-question-stage .option.selected::before{background:#9c4747}
.second-question-stage .option.selected{
  border-color:#a9814e;
  background:rgba(122,44,42,.17);
  box-shadow:inset 0 0 0 1px rgba(181,143,87,.10),0 8px 30px rgba(0,0,0,.16);
}
.second-question-stage .actions{position:relative;z-index:2;max-width:820px;margin:34px auto 0}
.second-question-stage .actions button{
  border:1px solid rgba(198,173,135,.35);
  background:rgba(255,255,255,.025);
  color:#d8cdbd;
  padding:10px 25px;
}
.second-question-stage .actions button:hover{border-color:#b8905d;background:rgba(255,255,255,.07)}

/* 暗场：不再加载参考图片，改为根据指定意象绘制的 SVG 花纹。 */
.second-effect-overlay{
  position:fixed;
  inset:0;
  z-index:10000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(24,25,24,.34),rgba(3,4,5,.97) 72%),
    rgba(3,5,6,.96);
  opacity:0;
  pointer-events:none;
  transition:opacity 1.05s ease;
  overflow:hidden;
}
.second-effect-overlay.show{opacity:1;pointer-events:auto}
.second-effect-overlay::before{
  content:"";
  position:absolute;
  inset:-8%;
  background-image:var(--effect-image);
  background-repeat:repeat;
  background-size:var(--effect-size,420px) var(--effect-size,420px);
  background-position:center;
  opacity:var(--effect-opacity,.18);
  transform:rotate(var(--effect-rotate,-4deg)) scale(1.08);
  mix-blend-mode:screen;
  pointer-events:none;
}
.second-effect-overlay::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(ellipse at center,transparent 0 20%,rgba(0,0,0,.23) 54%,rgba(0,0,0,.74) 100%),
    linear-gradient(90deg,rgba(0,0,0,.20),transparent 18% 82%,rgba(0,0,0,.20));
  pointer-events:none;
}
.second-effect-inner{
  position:relative;
  z-index:2;
  width:min(820px,82vw);
  text-align:center;
  padding:50px 30px 42px;
  border-top:1px solid rgba(208,182,133,.20);
  border-bottom:1px solid rgba(208,182,133,.20);
  animation:secondEffectRise 1.3s ease both;
}
.second-effect-inner::before,
.second-effect-inner::after{
  content:"◆";
  position:absolute;
  top:50%;
  color:rgba(198,161,91,.45);
  font-size:10px;
  transform:translateY(-50%);
}
.second-effect-inner::before{left:0}.second-effect-inner::after{right:0}
.second-effect-text{
  white-space:pre-line;
  font-family:"Songti SC","SimSun",serif;
  font-size:clamp(20px,3vw,31px);
  line-height:2.35;
  letter-spacing:.1em;
  text-shadow:0 0 18px currentColor;
  margin:0 auto 34px;
}
.second-effect-close{
  border:1px solid rgba(220,211,195,.42);
  background:rgba(0,0,0,.22);
  color:#ddd4c6;
  padding:10px 36px;
  cursor:pointer;
  font-family:inherit;
  letter-spacing:.22em;
  transition:.25s;
}
.second-effect-close:hover{background:rgba(255,255,255,.08);border-color:rgba(220,211,195,.72)}
@keyframes secondEffectRise{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:translateY(0)}}

/* 第二阶段结果页也保持同一整页视觉。 */
.second-result{
  display:block!important;
  text-align:center;
  padding-top:90px;
  padding-bottom:90px;
}
.second-result .result-box{
  background:rgba(255,255,255,.035);
  border:1px solid rgba(181,154,105,.24);
  padding:34px;
  text-align:left;
  color:#d7cec1;
  box-shadow:0 20px 60px rgba(0,0,0,.22);
}
.second-result .hidden-meter{height:4px;background:rgba(227,218,213,.10);margin:12px 0 24px;overflow:hidden}
.second-result .hidden-meter span{display:block;height:100%;background:#9a7279}
@media(max-width:680px){
  body.second-stage-active .panel::before{inset:12px}
  body.second-stage-active .panel::after{inset:18px}
  .second-question-stage,.second-result{padding:58px 22px 62px}
  .second-question-stage::after,.second-result::after{display:none}
  .second-question-stage .options{grid-template-columns:1fr}
  .second-question-stage .question-prompt{padding:18px 20px!important}
  .second-effect-inner{width:88vw;padding:42px 20px 35px}
}

const stageOneRawText = `01｜武职・灵力型 × 宮司型
该类型审神者出手时，往往意味着一件事已经被决定要解决。灵力在其手中不是辅助工具，而是能直接改变战场走向的力量。该类型审神者不倾向于让危险悬而未决，也不习惯把最棘手的问题留给别人收尾。
宮司型让这股力量指向整个本丸。该类型审神者不只考虑如何赢下眼前这一仗，还会判断这场战斗是否值得打、打完之后本丸是否还能保持稳定。这不是单纯的力量型审神者，而是一个知道该在什么地方、什么时候使用力量的主君。
02｜武职・灵力型 × 禰宜型
面对异常，该类型审神者通常先判断危险的位置，再把灵力集中过去。对其而言，解决问题优先于解释问题。
禰宜型让该类型审神者在出手之前会先确认周围的状态。刀剑男士的情况、队形、灵力是否足够支撑到收招，这些都会进入判断。其强大不是独来独往的类型，而是能让整支队伍跟着一起稳住局面的力量。
03｜武职・灵力型 × 権禰宜型
该类型审神者处理危机的方式很干净：先控住，再收尾。灵力对其而言是一种可靠的工具。不会因为能用力量就到处使用，也不会因为场面复杂就退开。
権禰宜型让这种战斗带有浓厚的事务感。出阵名单、灵力补给、战场残留、伤员回收——该类型审神者会把这些事情当成同一个任务来处理。别人打完仗松一口气的时候，其往往已经在确认下一件事。
04｜武职・灵力型 × 巫型
该类型审神者对灵力场的敏感程度超出一般人。别人还在判断"这里是不是有问题"，其可能已经先一步感觉到异常的位置和性质。其灵力不是被动等待命令的力量，而更接近对周围变化的一种直接回应。
巫型让这种感知渗进战斗方式里。该类型审神者会注意到对手的灵力节奏、刀剑男士的状态波动，甚至某些不属于战场的气息。其强项不完全来自输出，而来自比其他人更早判断该对什么出手。
05｜武职・灵力型 × 斎主型
该类型审神者使用灵力时带着一种克制。不是因为不敢用，而是因为清楚灵力一旦脱手，后果往往比战斗本身更持久。会尽量让力量落在必要范围之内，不多浪费，也不留下需要别人处理的隐患。
斎主型让这种克制变成一种职责。战后残留、异常扩散、刀剑是否需要净化——这些事该类型审神者都会亲自确认。对其而言，真正的战斗结束不是敌人倒下，而是本丸重新回到可以安心呼吸的状态。
06｜武职・刀术型 × 宮司型
该类型审神者更愿意站在刀剑男士身边，而不是站在后方看着他们出阵。其对战场的理解来自亲自参与，而不是单纯从报告上判断。这种距离感让其和刀剑之间的关系比普通审神者更紧密。
宮司型让这份战斗能力自然延伸为指挥力。该类型审神者能在混乱中判断谁适合前压、谁需要掩护、什么时候该退。这不是只会挥刀的审神者，而是亲自上阵、同时还能看清整个战局的人。
07｜武职・刀术型 × 禰宜型
该类型审神者的可靠不体现在最显眼的地方，而体现在"交给他就没问题"的那种感觉上。愿意亲自出手，也愿意处理战斗之外那些需要有人去做的杂事。队伍里有其在，很多事就不会堆积起来。
禰宜型让其尤其擅长队伍内部的平衡。会注意到谁状态不好、谁最近太累、谁适合和谁搭档。这不是那种站在聚光灯下的人，但往往是大家下意识会去看一眼的那个人。
08｜武职・刀术型 × 権禰宜型
该类型审神者不太相信"差不多就行"。装备要检查、出阵要确认、补给要到位、损耗要记录——这些事在其眼里和战斗本身一样重要。其相信一场仗打得顺不顺，很多时候在开打之前就已经决定了。
権禰宜型让这种务实性体现得尤其明显。该类型审神者的本丸可能不是最有传奇色彩的，但一定是最不容易在关键时刻掉链子的那种。这是让"武职"真正成为一份可运转职责的审神者。
09｜武职・刀术型 × 巫型
该类型审神者通过一起战斗来理解刀剑男士。别人可能需要通过对话和时间去了解一振刀，而其更习惯在并肩作战的过程中直接感受对方的节奏、习惯和情绪。默契往往不是谈出来的，而是打出来的。
巫型让这种"一起战斗"的关系格外敏感。该类型审神者会注意到某振刀今天出手比平时重、某振刀在某个位置犹豫了一瞬。这不是把刀剑当作武器使用的人，而是把他们当成一起站在战场上的人。
10｜武职・刀术型 × 斎主型
该类型审神者清楚战斗是有代价的。不是怕打，而是明白每一场战斗都会留下一些东西——伤口、痕迹、情绪、灵力上的紊乱。不会把"赢了"当作结束，而会接着想"然后呢"。
斎主型让刀术带着一种有始有终的节奏。该类型审神者会确认战场是否干净、刀剑是否需要恢复、本丸是否还能维持原状。其可靠不是"打得多"，而是"打完还能把一切带回正轨"。
11｜武职・近战型 × 宮司型
该类型审神者不太依赖大范围灵力，而是靠身体、技巧和判断力解决问题。这种方式更慢，但更稳，也更能让其在长时间行动中保持状态。不追求一击制胜，而是让自己始终能在场上发挥作用。
宮司型让这种稳定性转化成威信。该类型审神者不是靠命令让人跟随，而是靠"我自己也在做"来让本丸形成方向感。其队伍往往有一种很朴素的信任：主君站在这里，那就继续往前走。
12｜武职・近战型 × 禰宜型
该类型审神者属于能一直工作的类型。不会因为灵力消耗太快而中途退场，也不会因为场面混乱就失去判断。其在场，本身就是一种稳定因素。
禰宜型让其格外关注那些容易被忽略的空缺。别人忙不过来的时候会默默补上；队伍出现缝隙的时候会站进去。其贡献不一定写在功劳簿最上面，但少一个，本丸的运转就会明显变得吃力。
13｜武职・近战型 × 権禰宜型
该类型审神者相信重复的价值。一个动作练一千遍、一套流程跑一百次，都是为了在关键时刻不用思考也能做对。不迷信奇迹，更相信准备充分的必然性。
権禰宜型把这种信念变成了具体的日常。训练、装备、补给、损耗——该类型审神者会把这些武职事务处理得很清楚。可能不是最有想象力的审神者，但一定是最不容易出漏洞的那种。
14｜武职・近战型 × 巫型
该类型审神者的身体比想象中更敏感。会在危险发生之前感到不对劲，会在对方还没动作的时候先有反应。这种直觉让其在中近战中尤其占优势，因为能比别人更早做出判断。
巫型让这种敏锐延伸到战斗之外。会注意到刀剑男士的情绪变化、灵力波动，甚至本丸某个角落气氛不对。这不是靠灵力压制世界的人，而是靠自身去感应、理解并回应世界的人。
15｜武职・近战型 × 斎主型
该类型审神者属于耐久型。不追求爆发，更在意自己能否一直保持清醒。知道身体一旦垮了，再好的判断也没用，因此会主动控制节奏，不让本丸陷入无谓的消耗。
斎主型让其格外关注战后的恢复与清理。伤口、残留、异常、情绪——这些不会自动消失。其负责方式是安静而持久的：把危险确认干净，让本丸真正回到安全状态。
16｜武职・远攻型 × 宮司型
该类型审神者更习惯从稍远的位置观察战场。不是因为不敢靠近，而是因为在那个距离上能看得更清楚、判断得更准确。其价值不在于冲在最前面，而在于让整个战局因为其判断而重新排列。
宮司型让这种观察力上升为指挥力。会在关键时刻下令支援、叫停、后撤或集火。不需要冲到最前方才能掌握战局，其存在感来自知道该往哪里看、往哪里打。
17｜武职・远攻型 × 禰宜型
该类型审神者的战斗方式是持续的、稳定的、不喧哗的。不会突然爆发一下就结束，而是能在整个战斗过程中一直提供有效的支援。其在队伍里的位置不显眼，但缺了会立刻感觉到。
禰宜型让其尤其擅长配合。会根据队友的位置和状态调整自己的站位，会在别人需要的时候把压力接过来。其战斗像一张不声张的网，撑住了很多原本可能出现的漏洞。
18｜武职・远攻型 × 権禰宜型
该类型审神者倾向于把能力变成可以稳定复现的东西。远距离攻击对其来说不只是一次精准，而是一整套需要准备的系统：装备、状态、位置、时机、补给、维护。任何一个环节没处理好，都不算完成。
権禰宜型让该类型审神者的本丸在战斗准备上很少出岔子。可能不是那种让人热血沸腾的审神者，但一定是最让人觉得"这个人交出来的东西靠得住"的那种。
19｜武职・远攻型 × 巫型
该类型审神者习惯先看，再动。不是犹豫，而是在等那个真正值得出手的瞬间。其攻击往往不密集，但每次都有明确的目的。
巫型让这种观察中更容易注意到肉眼之外的讯息。灵力变化、气场偏移、某振刀剑的反应——这些都会进入判断。其强大不是压制，而是在对的时刻做出对的回应。
20｜武职・远攻型 × 斎主型
该类型审神者不倾向于让战斗无限扩大。能控制距离就尽量控制距离；能在小范围内解决，就不让它蔓延到本丸。其清楚战斗的影响范围往往比战斗本身更值得担心。
斎主型让其格外在意战场的边界与收尾。攻击是否精准、残留是否清除、异常是否扩散——这些都在判断之内。其追求的不是最大的破坏，而是最小而完整的解决。
21｜武职・共鸣型 × 宮司型
该类型审神者与刀剑男士之间的同步性很强。能够感知对方的节奏、判断和情绪，并在此基础上调整自己的行动。配合不是靠语言，而更接近一种直接的理解。
宮司型让这种连接指向整体。不只会和某一振刀密切配合，还能把这种理解扩散到整支队伍。其本丸往往有一种很强的"一起行动"的氛围，而该类型审神者就是让这种氛围成形的人。
22｜武职・共鸣型 × 禰宜型
该类型审神者善于进入别人的节奏。不是模仿，而是理解。能在很短的时间内适应一振刀剑男士的战斗方式，并且让对方也觉得配合很顺。
禰宜型让其把这种能力用在团队关系上。会主动协调不同刀剑之间的配合，会注意谁和谁在一起效果更好、谁最近需要被照顾。其本丸往往关系比较融洽，因为该类型审神者是真的在听、在看、在调整。
23｜武职・共鸣型 × 権禰宜型
该类型审神者的共鸣不是停留在感觉层面的东西。会去关注它怎么运作、什么时候有效、什么时候可能出问题。对"配合"这件事有非常实际的理解。
権禰宜型让其把这些抽象的东西变成可以执行的安排。状态记录、配合流程、恢复节奏、负担分配——这些具体事务都会进入考虑范围。这是能把特殊能力真正用起来的审神者。
24｜武职・共鸣型 × 巫型
该类型审神者对刀剑男士的状态非常敏感。这种敏感不是战术层面的，而更接近一种"我知道你现在怎么了"的直接感受。很多时候，对方还没开口，其已经知道该做什么。
巫型让这种连接成为其与刀剑关系的核心。与刀剑之间的距离比一般审神者更近，也更私人化。其本丸往往有一种独特的亲密感，而这种亲密感是该类型审神者和刀剑男士一起建立起来的。
25｜武职・共鸣型 × 斎主型
该类型审神者比大多数人都更清楚"连接"是有风险的。理解一个人越深，越容易被牵扯进去；和刀剑男士走得太近，也未必总是好事。
斎主型让其在这种深度连接中保持清醒。知道什么时候应该靠近，也知道什么时候必须退开。这不是那种用"我们是一体的"来定义关系的人，而是能在理解对方的同时，仍然让彼此保持完整。
26｜文职・军师型 × 宮司型
该类型审神者习惯把一场战斗放到更大的图景里去看。不只是"这一仗怎么打"，还有"为什么打、谁来打、打完怎么办"。关注的是整个本丸在一段时间里的走向，而不是一次行动的结果。
宮司型让其判断带有统御性质。会在战前定下整体方向，在战中根据变化调整，在战后重新评估布局。这不是被单一战局牵着走的军师，而更接近一个在本丸上方建立棋盘的人。
27｜文职・军师型 × 禰宜型

      buf = [];

    }

let i=0, ans={}, alloc={感知:20, 励起:20, 顕現:20, 契约:20, 维持:20};
const app=document.querySelector('#app');
let secondI=0, hiddenAns={}, privateInfo={birthDate:'',birthHour:'',region:''}, warningShown=false;

function render(){
  if(i===0) return renderAlloc();
  let q=qs[i];
  app.innerHTML=`<div class="qno">${i} / ${qs.length}</div>
  <div class="progress"><span class="bar" style="width:${(i/qs.length)*100}%"></span></div>
  <div class="question">${q.title}</div>
  <div class="options">${q.options.map((o,n)=>`<button class="option ${ans[q.id]===n?'selected':''}" onclick="chooseOption(${n})">${o[0]}</button>`).join('')}</div>
  <div class="actions"><button class="secondary" onclick="prev()">上一步</button><button onclick="next()">${i===qs.length-1?'查看结果':'下一题'}</button></div>`;
}
function chooseOption(n){ let q=qs[i]; ans[q.id]=n; render(); }
function renderAlloc(){
  let total=Object.values(alloc).reduce((a,b)=>a+b,0);
  let remain=100-total;
  let warnClass= remain===0 ? '' : 'warning';
  app.innerHTML=`<div class="qno">基础五术 · 灵力分配</div>
  <div class="progress"><span class="bar" style="width:4%"></span></div>

function setAlloc(k,v){ v=Math.max(0,Math.min(100,parseInt(v,10)||0)); alloc[k]=v; renderAlloc(); }
function next(){

  s.战斗=(s.战斗||0)+(s.近战||0);

  s.主动照护=(s.照护||0)+(s.治疗||0);
  s.神事=(s.神事||0)+(s.灵务||0);
  s.独立性=s.独立||0;
  s.社交性=s.社交||0;
  s.稳定性=s.稳定||0;
  s.保护欲=s.保护||0;
  s.边界意识=s.边界||0;
  s.主动照护=s.照护||0;
  s.军略=(s.领导||0)+(s.行政||0);
  s.治疗=s.照护||0;
  s.灵务=s.神事||0;
  s.近战=s.战斗||0;
  s.远攻=s.侦察||0;

  const roleScores={
    武职:(s.战斗||0)+(s.爆发||0)+(s.近战||0)+(s.远攻||0)+(s.灵力型||0)+(s.刀术型||0),
    文职:(s.文职||0)+(s.考据||0)+(s.历史||0)+(s.军略||0)+(s.行政||0),
    祝部:(s.照护||0)+(s.治疗||0)+(s.净化||0)+(s.灵务||0),
    守护职:(s.保护||0)+(s.防御||0)+(s.边界||0)+(s.守护型||0)
  };
  const role=Object.keys(roleScores).sort((a,b)=>roleScores[b]-roleScores[a])[0];
  const subMap={
    武职:[['灵力型',s.灵力型||0],['刀术型',s.刀术型||0],['近战型',s.近战||0],['远攻型',s.远攻||0],['共鸣型',s.共鸣||0]],

    祝部:[['治疗型',(s.治疗||0)+(s.照护||0)],['净化型',(s.净化||0)+(s.灵务||0)]],
    守护职:[['守护型',(s.保护||0)+(s.防御||0)+(s.边界||0)]]
  };
  const sub=subMap[role].sort((a,b)=>b[1]-a[1])[0][0];
  const identityScores={宮司型:(s.神事||0)+(s.领导||0)+(s.顕現||0),禰宜型:(s.文职||0)+(s.历史||0)+(s.考据||0),権禰宜型:(s.行政||0)+(s.维持||0)+(s.协作||0),巫型:(s.感知||0)+(s.社交||0)+(s.照护||0),斎主型:(s.保护||0)+(s.防御||0)+(s.净化||0)};
  const identity=Object.keys(identityScores).sort((a,b)=>identityScores[b]-identityScores[a])[0];

  const fields=['独立性','社交性','稳定性','保护欲','边界意识','主动照护','战斗','防御','爆发','持久','侦察','行政','后勤','历史','考据','领导','神事','净化','战友','近战','远攻','军略'];
  const userProfile=Object.fromEntries(fields.map(f=>[f,Math.min(100,(s[f]||0)*2)]));
  const distance=(c)=>fields.reduce((sum,f)=>sum+Math.abs((+c[f]||0)-(userProfile[f]||0)),0);
  const best=chars.map(c=>({c,d:distance(c)})).sort((a,b)=>a.d-b.d)[0];
  const comp=chars.map(c=>({c,d:fields.reduce((sum,f)=>sum+Math.max(0,(+c[f]||0)-(userProfile[f]||0)),0)})).sort((a,b)=>b.d-a.d)[0];

  const key = `${role}・${sub} × ${identity}`;
  const stageText = stageOneDescriptions[key] || '';

  const compText = (characterMatchTexts[comp.c.刀剣男士]||{}).complementary || '';

  app.innerHTML=`<div class="result" style="display:block;text-align:center;padding:15px 0 20px">
    <div class="result-seal" style="width:82px;height:82px;border:1px solid #b99673;border-radius:50%;display:grid;place-items:center;margin:0 auto 25px;color:#a77e54;font-size:12px;letter-spacing:.15em">御神籬</div>
    <div class="eyebrow" style="color:var(--rose);letter-spacing:.22em;font-size:12px">YOUR HONMARU RESPONDS</div>
    <h3 style="font-size:44px;font-weight:500;margin:10px 0;color:#243e4f">审神者职能 · ${role}</h3>
    <div class="big">专精倾向：${sub}</div>
    <div class="name-jp" style="font-family:Georgia,serif;font-size:14px;letter-spacing:.25em;color:#9b7479">本丸身份：${identity}</div>
    <div class="result-box" style="max-width:760px;margin:24px auto 0;padding:24px;text-align:left;background:rgba(255,255,255,.45);border:1px solid rgba(181,154,105,.25)">
      <p style="margin:0;color:#59676e;line-height:2;white-space:pre-line">${stageText}</p>
    </div>
    <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:24px 0">
      ${Object.keys(s).filter(k=>s[k]>0).sort((a,b)=>s[b]-s[a]).slice(0,5).map(k=>`<span class="tag" style="display:inline-block;border:1px solid var(--line);color:#6a7a82;padding:5px 9px;margin:4px;font-size:12px">${k}</span>`).join('')}
    </div>
    <div class="result-box" style="max-width:760px;margin:35px auto 0;padding:30px;text-align:left;background:rgba(255,255,255,.65);border:1px solid rgba(181,154,105,.3)">
      <p style="margin:7px 0;color:#59676e"><strong>基础五术：</strong>感知 ${alloc.感知}／励起 ${alloc.励起}／顕現 ${alloc.顕現}／契约 ${alloc.契约}／维持 ${alloc.维持}</p>
      <div style="margin:18px 0 24px;padding-bottom:20px;border-bottom:1px solid rgba(181,154,105,.22)">
        <p style="margin:7px 0;color:#59676e"><strong>最适配的刀剑男士：</strong>${best.c.刀剣男士}</p>
        <p style="margin:9px 0;color:#59676e;line-height:1.9;white-space:pre-line">${bestText}</p>
      </div>
      <div style="margin:18px 0">
        <p style="margin:7px 0;color:#59676e"><strong>互补的刀剑男士：</strong>${comp.c.刀剣男士}</p>
        <p style="margin:9px 0;color:#59676e;line-height:1.9;white-space:pre-line">${compText}</p>
      </div>
      <p class="note">本结果不是能力等级评判。四大职能与五术人人皆有，差异来自本次分配与答题所形成的专精方向。</p>
      <p style="margin-top:18px;color:#8d6b70">"要测试额外的内容吗？"</p>
    </div>
    <button class="restart-btn" onclick="secondStageIntro()" style="background:transparent;border:1px solid var(--line);color:var(--ink);padding:10px 24px;cursor:pointer;font-family:inherit;margin-top:20px;transition:.2s">继续测试</button>
    <button class="restart-btn" onclick="location.reload()" style="background:transparent;border:1px solid var(--line);color:var(--ink);padding:10px 24px;cursor:pointer;font-family:inherit;margin-top:10px;transition:.2s">重新举行一次禊</button>
  </div>`;
}

  scarf:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240"><g fill="none" stroke="#a94a4e" stroke-width="3"><path d="M60 40q40-20 80 0t80 0 80 0v140q-40 20-80 0t-80 0-80 0z" fill="#a94a4e" opacity=".6"/><path d="M100 50q20 50 0 120M140 60q20 50 0 110M180 50q20 50 0 120M220 60q20 50 0 110M260 50q20 50 0 120" stroke="#d98e93" stroke-width="1.5"/><path d="M60 180l-10 40M70 180l-10 40M80 180l-10 40M90 180l-10 40M100 180l-10 40" stroke="#a94a4e" stroke-width="2"/><path d="M300 180l10 40M290 180l10 40M280 180l10 40M270 180l10 40M260 180l10 40" stroke="#a94a4e" stroke-width="2"/></g></svg>`,
  sasa:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260"><g fill="none" stroke="#7a9cd4" stroke-width="2"><path d="M150 100q-20-20-30-40 20 10 30 30 10-20 30-30-10 20-30 40z" fill="#6b8fd4" opacity=".8"/><path d="M150 100q-20 10-30 30 20-10 30-20 10 10 30 20-10-20-30-30z" fill="#6b8fd4" opacity=".8"/><path d="M150 100q-10 20-10 40 10-10 10-30 0 20 10 30 0-20-10-40z" fill="#6b8fd4" opacity=".8"/><path d="M120 60l-5-5M125 65l-5-5M180 60l5-5M175 65l5-5M120 130l-5 5M125 125l-5 5M180 130l5 5M175 125l5 5" stroke="#a8c4e8" stroke-width="1"/><path d="M100 180q-20-20-30-40 20 10 30 30 10-20 30-30-10 20-30 40z" fill="#6b8fd4" opacity=".8"/><path d="M100 180q-20 10-30 30 20-10 30-20 10 10 30 20-10-20-30-30z" fill="#6b8fd4" opacity=".8"/><path d="M200 180q-20-20-30-40 20 10 30 30 10-20 30-30-10 20-30 40z" fill="#6b8fd4" opacity=".8"/><path d="M200 180q-20 10-30 30 20-10 30-20 10 10 30 20-10-20-30-30z" fill="#6b8fd4" opacity=".8"/><path d="M150 140q-10 40-30 80M150 140q10 40 30 80M150 140v90" stroke="#6b8f4a" stroke-width="2"/><path d="M130 200q-10-10-20 0 10 10 20 0M170 200q10-10 20 0-10 10-20 0" stroke="#6b8f4a" stroke-width="1.5"/></g></svg>`,
  wisteria:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 280"><g fill="none" stroke="#9c6b9f" stroke-width="2"><path d="M20 30q80 20 160 0t120 0" stroke="#8a6a4a" stroke-width="3"/><path d="M80 40v80M150 35v125M220 40v90M260 35v65" stroke="#8a6a4a" stroke-width="1.5"/><g fill="#9c6b9f" opacity=".8"><circle cx="80" cy="120" r="6"/><circle cx="75" cy="135" r="5"/><circle cx="85" cy="150" r="5"/><circle cx="78" cy="165" r="4"/><circle cx="82" cy="180" r="4"/><circle cx="80" cy="195" r="3"/></g><g fill="#b88bc0" opacity=".8"><circle cx="150" cy="160" r="7"/><circle cx="145" cy="175" r="6"/><circle cx="155" cy="190" r="6"/><circle cx="148" cy="205" r="5"/><circle cx="152" cy="220" r="5"/><circle cx="150" cy="235" r="4"/><circle cx="150" cy="250" r="3"/></g><g fill="#9c6b9f" opacity=".8"><circle cx="220" cy="130" r="6"/><circle cx="215" cy="145" r="5"/><circle cx="225" cy="160" r="5"/><circle cx="218" cy="175" r="4"/><circle cx="222" cy="190" r="4"/></g><g fill="#b88bc0" opacity=".8"><circle cx="260" cy="100" r="5"/><circle cx="255" cy="115" r="5"/><circle cx="265" cy="130" r="4"/><circle cx="258" cy="145" r="4"/></g><path d="M100 50q10 20 0 40-10-20 0-40M180 45q10 20 0 40-10-20 0-40M240 50q10 20 0 40-10-20 0-40" stroke="#6b8f4a" stroke-width="1.5" fill="#6b8f4a" opacity=".6"/></g></svg>`,
  teacup:`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160"><ellipse cx="100" cy="60" rx="80" ry="30" fill="#e03a2a" stroke="#b02010" stroke-width="2"/><path d="M20 60 Q100 140 180 60 L160 110 Q100 130 40 110 Z" fill="#cc3322" stroke="#9c1f13" stroke-width="2"/><path d="M70 110 L130 110 L120 140 L80 140 Z" fill="#b52b1c" stroke="#9c1f13" stroke-width="2"/><ellipse cx="100" cy="60" rx="80" ry="30" fill="#e04a3a" opacity=".4"/><g stroke="#1a1a1a" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M40 60 Q70 75 110 65 Q140 55 170 70"/><path d="M70 70 Q80 85 95 90"/><path d="M140 60 Q150 75 165 80"/><path d="M95 90 Q105 85 115 95"/><path d="M55 65 Q65 55 75 65"/><path d="M155 68 Q165 60 170 68"/></g></svg>`
};
function motifData(key){
  const svg=secondMotifs[key]||secondMotifs.light;
  return `url("data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}")`;
}

function renderSecondQuestion(){
  const q=hiddenQs[secondI];
  app.innerHTML=`<div class="second-question-stage">
    <div class="second-stage-inner">
      <div class="qno">后续测试 · ${secondI+1} / ${hiddenQs.length}</div>
      <div class="progress"><span class="bar" style="width:${((secondI+1)/hiddenQs.length)*100}%"></span></div>
      <div class="second-stage-kicker">A FURTHER RECORD · 彼岸记录</div>
      <div class="question">${q.title}</div>
      <div class="question-prompt" style="white-space:pre-line;text-align:left;line-height:1.9;font-size:16px">${q.prompt||''}</div>
      <div class="options">${q.options.map((o,n)=>`<button class="option ${hiddenAns[q.id]===n?'selected':''}" onclick="chooseHidden(${n})"><strong>${String.fromCharCode(65+n)}.</strong> ${o[0]}</button>`).join('')}</div>
      <div class="actions"><button class="secondary" onclick="hiddenPrev()">上一步</button><button onclick="hiddenNext()">${secondI===hiddenQs.length-1?'查看结果':'下一题'}</button></div>
    </div>
  </div>`;
}

const secondEffects={
  Q33:{3:{color:'#315f3b',text:'身体不适所以坐下来休息吗？\n需要我治愈您吗？请不要在此久留。',motif:'arrow',opacity:.18,size:'360px'}},
  Q34:{4:{color:'#9b65a9',text:'可是，刀身上映照出来的——\n\n“只有主人的脸。”',motif:'light',opacity:.13,size:'500px'}},
  Q35:{1:{color:'#6f3a7e',text:'「不動行光、つくも髪、人には五郎左御座候」\n\n“嗯？主人？”\n\n“您不应该这里。”\n\n“至少今天不可以。”',motif:'sake',opacity:.18,size:'430px'}},
  Q36:{2:{color:'#b54b4f',text:'“我也不知道，但是······”\n“海底之下焉有龙宫。”',motif:'biwa',opacity:.16,size:'440px'},3:{color:'#d77d31',text:'“喂喂，主人！”\n“上一个这样做的人，下场可是很惨的哦！”',motif:'turtle',opacity:.18,size:'410px'}},
  Q37:{3:{color:'#f0eee7',text:'“总有一些地方，会让我们模糊了时间的概念。”\n“对吧？”',motif:'cranes',opacity:.15,size:'480px'}},
  Q38:{3:{color:'#b54b4f',text:'“那个，让我陪你一起去，”\n“也可以哦？”',motif:'scarf',opacity:.13,size:'520px'}},
  Q39:{3:{color:'#c9a84b',text:'“欸？”\n\n“是恶作剧？”\n\n“还是邀请？”',motif:'sasa',opacity:.17,size:'430px'}},
  Q40:{4:{color:'#c29acb',text:'“等一下。”\n\n“请您，不要丢下我。”',motif:'wisteria',opacity:.18,size:'420px'}},
  Q41:{3:{color:'#2a5a7a',text:'“那么，下一次就留下来吧。”\n“我为你准备了最好的茶。”',motif:'teacup',opacity:.18,size:'380px'}}
};
function chooseHidden(n){
  hiddenAns[hiddenQs[secondI].id]=n;
  renderSecondQuestion();
  const effect=secondEffects[hiddenQs[secondI].id]&&secondEffects[hiddenQs[secondI].id][n+1];
  if(effect) setTimeout(()=>showSecondEffect(effect),80);
}
function showSecondEffect(effect){
  const overlay=document.getElementById('secondEffectOverlay');
  const text=document.getElementById('secondEffectText');
  text.textContent=effect.text;
  text.style.color=effect.color;
  overlay.style.setProperty('--effect-image',motifData(effect.motif));
  overlay.style.setProperty('--effect-opacity',String(effect.opacity||.17));
  overlay.style.setProperty('--effect-size',effect.size||'420px');
  overlay.style.setProperty('--effect-rotate',effect.rotate||'-4deg');
  overlay.classList.add('show');
  overlay.setAttribute('aria-hidden','false');
}
function dismissSecondEffect(){
  const overlay=document.getElementById('secondEffectOverlay');
  overlay.classList.remove('show');
  overlay.setAttribute('aria-hidden','true');
}

function hiddenNext(){
  if(!Object.prototype.hasOwnProperty.call(hiddenAns,hiddenQs[secondI].id)) return alert('请选择一个答案。');
  if(secondI<hiddenQs.length-1){ secondI++; renderSecondQuestion(); } else secondResult();
}
function hiddenPrev(){ if(secondI===0){ renderSecondIntro(); return; } secondI--; renderSecondQuestion(); }
function secondResult(){
  let score=0;
  hiddenQs.forEach(q=>{ if(Object.prototype.hasOwnProperty.call(hiddenAns,q.id)) score+=q.options[hiddenAns[q.id]][1]; });
  let level,title,body,tendency;
  if(score<=4){level='人世定着';title='你的存在与此世之间有非常稳定的联系。';body='你可以对未知产生兴趣，也可以理解那些无法解释的事情，但你很少主动回应来自边界之外的东西。即使有人叫出你的名字，即使有人向你指出另一条道路，你也很清楚自己到底要回到哪里。对于你而言："回来"不是一种选择，而是理所当然的事情。';tendency='极低';}
  else if(score<=8){level='守门之人';title='你能够察觉到某些不同寻常之处，但很少主动跨越界限。';body='你并不排斥未知。只是你很清楚：门可以打开，但不是每一扇门都需要进去。即使遇到异常，你通常仍然会优先确认自己的位置、身份与归处。你或许能够与"那边"擦肩而过，却很难真正被留下。';tendency='低';}
  else if(score<=12){level='回首者';title='你比自己想象中更加容易记住那些"不应该存在的东西"。';body='一个名字、一处地方、一段无法解释的经历，都可能在事情结束之后继续留在你的意识里。你总还是会回来的。只是：回来以后，你可能会回头看。而真正的危险，往往发生在这次回头。';tendency='偏低';}
  else if(score<=16){level='渡边之人';title='你对于两个世界之间的距离没有那么敏感。';body='你可以在熟悉的秩序中生活，也可以接受完全不同的规则。如果有人告诉你："这里之外还有另一个地方。"你未必会相信。但你很可能会想："如果真的存在，我想看看。"你并不容易被强行带走，不过你很容易自己走过去。';tendency='中等';}
  else if(score<=20){level='受呼之人';title='对于"来自另一边的邀请"，你有着格外明显的回应。';body='尤其是当对方知道你的名字、记得你的事情、或者能够给予你一种现实世界无法给予的归属感时，你很难完全无动于衷。好奇并不代表着危险，但是：你会回应。而只要回应发生，你们之间就已经建立了关系。';tendency='中高';}
  else if(score<=23){level='留席之人';title='如果有一个地方愿意为你留下位置，你未必会拒绝。';body='你对"被需要""被记得""被等待"有很强的感受能力。现实世界与另一个世界之间，如果真的出现了选择，你更在意的是："哪里的人真正把我当成这里的一员？"这意味着风险并不完全来自外界。有时候，是另一个世界给了你留下来的理由。';tendency='高';}
  else if(score<=27){level='彼岸有名';title='或许祂已经记住了你的名字。';body='你对异常的感知、对关系的执着、对未知世界的回应，有时候让对方怀疑，你可能是愿意自己走过去的人。如果有一个地方反复呼唤你，而那里有着你重要的人、物或记忆，那么现实世界对你的牵引可能会越来越弱。';tendency='极高';}
  else {level='不知归处';title='你与"此世"的边界非常薄。';body='你可能并不热衷于神秘，也未必相信任何传说。但如果某一天，你真的踏入那个地方——你可能根本不会怀疑这是假的，而是感慨，为什么过了这么久才来到这里。祂不需要强行带走你，那里早就准备好了一个位置，只等祂伸出手。';tendency='极高／特殊型';}

  app.innerHTML=`<div class="second-result" style="display:block;text-align:center;padding:15px 0 20px">
    <div class="result-seal" style="width:82px;height:82px;border:1px solid #b99673;border-radius:50%;display:grid;place-items:center;margin:0 auto 25px;color:#a77e54;font-size:12px;letter-spacing:.15em">御神籬</div>
    <div class="eyebrow">A FURTHER RECORD</div>
    <h3 style="font-size:38px;font-weight:500;margin:10px 0;color:#243e4f">${level}</h3>
    <div class="big">${title}</div>
    <div class="result-box" style="max-width:760px;margin:28px auto 0">
      <p style="margin:0;color:#59676e;line-height:2">${body}</p>
      <div style="margin-top:24px;padding-top:20px;border-top:1px solid rgba(181,154,105,.22)">
        <p style="margin:0 0 8px;color:#59676e"><strong>这份记录：</strong>来自后续十道题的选择轨迹。</p>
        <div class="hidden-meter"><span style="width:${(score/30)*100}%"></span></div>
        <p class="note" style="margin:0">神隐倾向：${tendency}　·　记录分数：${score} / 30</p>
      </div>
    </div>
    <p style="margin:30px auto 0;max-width:700px;color:#8d6b70;line-height:1.9">"欢迎回来。"</p>
    <button class="restart-btn" onclick="location.reload()">重新举行一次禊</button>
  </div>`;
}

render();
</script>
</body>
</html>
